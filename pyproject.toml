[project]
name = "sumi-pdf"
version = "0.7.2"
description = "SUMIPDF - local-first PDF redaction / text-edit / OCR / crypto toolkit with MCP server (MIT)"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "pypdf>=6.0",
    "pypdfium2>=4.30",
    "reportlab>=4.0",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
app = ["pywebview>=5.0"]
build = ["pyinstaller>=6.0"]
test = ["pytest>=8.0"]

[project.scripts]
sumi-server = "sumi_pdf.server:main"
sumi-mcp = "sumi_pdf.mcp_server:main"
sumi-app = "sumi_pdf.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
